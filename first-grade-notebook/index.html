<title>First Grade Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* Layout: one notebook column (max ~1000px). Home = greeting, today's plan on a ruled page, three subject tracks.
   Quiz = a single ruled notebook page with big answer tiles. Andika (built for beginning readers) carries every word she reads. */
:root{
  --bg:#EAF0F8; --surface:#FFFFFF; --surface-2:#F3F7FD; --ink:#1B2640; --muted:#56658A; --line:#CBD7EA;
  --rule:#D6E2F4; --margin:#F2A7A3; --hole:#EAF0F8;
  --math:#2F64CE; --read:#C9502A; --world:#1E8656; --star:#F0AE00;
  --math-bg:#E3EBFB; --read-bg:#FBE8E0; --world-bg:#DFF2E8;
  --good:#1C9256; --good-bg:#E2F5EA; --oops:#C93A3A; --oops-bg:#FBE6E4;
  --cta:#1F57C3; --cta-edge:#173F8E; --on-cta:#FFFFFF;
  --shadow:0 1px 0 rgba(27,38,64,.05), 0 10px 26px -14px rgba(27,38,64,.32);
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-read:"Andika","Comic Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --surface:#18223A; --surface-2:#1F2B47; --ink:#E9EFFB; --muted:#A2B1CF; --line:#2F3E60;
    --rule:#243150; --margin:#7E3E48; --hole:#0F1626;
    --math:#86ACFF; --read:#FF9A70; --world:#57CD94; --star:#FFC83D;
    --math-bg:#1E2B50; --read-bg:#3A241F; --world-bg:#163325;
    --good:#4AD48D; --good-bg:#153728; --oops:#FF7E72; --oops-bg:#3F1F25;
    --cta:#86ACFF; --cta-edge:#4F72C4; --on-cta:#0B1222;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#18223A; --surface-2:#1F2B47; --ink:#E9EFFB; --muted:#A2B1CF; --line:#2F3E60;
  --rule:#243150; --margin:#7E3E48; --hole:#0F1626;
  --math:#86ACFF; --read:#FF9A70; --world:#57CD94; --star:#FFC83D;
  --math-bg:#1E2B50; --read-bg:#3A241F; --world-bg:#163325;
  --good:#4AD48D; --good-bg:#153728; --oops:#FF7E72; --oops-bg:#3F1F25;
  --cta:#86ACFF; --cta-edge:#4F72C4; --on-cta:#0B1222;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-read);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--cta);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}

/* subject accents */
.s-math{--acc:var(--math);--acc-bg:var(--math-bg)}
.s-read{--acc:var(--read);--acc-bg:var(--read-bg)}
.s-world{--acc:var(--world);--acc-bg:var(--world-bg)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px}
.brand{font:800 22px/1 var(--f-display);letter-spacing:.2px;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--read);font-weight:800}
.brand small{font:500 13px/1 var(--f-read);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer}
.tool[aria-pressed="false"]{color:var(--muted)}
.tool[aria-pressed="false"] .wave{opacity:0}
.tool .ico{width:18px;height:18px}
.who{display:inline-flex;align-items:center;gap:8px}
.ava{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:800 14px/1 var(--f-display);color:#fff;background:var(--c,#2F64CE)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font:700 18px/1.1 var(--f-display);cursor:pointer;text-decoration:none}
.btn.cta{background:var(--cta);color:var(--on-cta);box-shadow:0 5px 0 var(--cta-edge);margin-bottom:5px}
.btn.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cta-edge)}
.btn.big{font-size:26px;padding:16px 34px;border-radius:20px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);font:700 15px/1 var(--f-read);padding:9px 14px;border-radius:12px}
.btn.soft{background:var(--surface-2);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}

/* notebook page */
.page{position:relative;background-color:var(--surface);
  background-image:linear-gradient(90deg,transparent 0 40px,var(--margin) 40px 42px,transparent 42px),
    repeating-linear-gradient(180deg,transparent 0 43px,var(--rule) 43px 44px);
  border-radius:8px 18px 18px 8px;box-shadow:var(--shadow);padding:26px 22px 24px 60px}
.page::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:16px;
  background:radial-gradient(circle at 8px 8px,var(--hole) 0 6.5px,transparent 7.5px) 0 34px/16px 140px repeat-y}
@media (max-width:520px){
  .page{padding:20px 14px 20px 40px;background-image:linear-gradient(90deg,transparent 0 26px,var(--margin) 26px 28px,transparent 28px),repeating-linear-gradient(180deg,transparent 0 43px,var(--rule) 43px 44px)}
  .page::before{left:5px;width:14px;background-size:14px 140px}
}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font:800 clamp(34px,6vw,48px)/1.05 var(--f-display)}
.hello p{margin:6px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats{align-items:flex-start}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .val{font:800 24px/1 var(--f-display);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat .val .star{width:24px;height:24px}
.week{display:flex;gap:5px}
.week span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.week i{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center}
.week i.on{border:0;background:var(--star)}
.week i.on::after{content:"";width:10px;height:10px;background:var(--surface);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.week span.today{color:var(--ink);font-weight:700}

.today{margin-bottom:28px}
.today h2{font:800 26px/44px var(--f-display);margin-top:-8px}
.today .sub{margin:0 0 6px;color:var(--muted);line-height:44px}
.plan{list-style:none;margin:0 0 18px;padding:0;display:grid}
.plan li{display:flex;align-items:center;gap:10px;min-height:44px;font-size:19px}
.plan .dot{width:12px;height:12px;border-radius:50%;background:var(--acc);flex:none}
.plan .kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border:1.5px solid currentColor;border-radius:999px;padding:1px 8px;font-weight:700}
.plan .t{min-width:0}
.today .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.today .row .note{color:var(--muted);font-size:15px}

.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.maphead h2{font:800 26px/1.1 var(--f-display)}
.maphead p{margin:0;color:var(--muted);font-size:15px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.tracks{grid-template-columns:minmax(0,1fr)}}
.track{background:var(--surface);border-radius:18px;padding:14px 12px 12px;border-top:6px solid var(--acc);box-shadow:var(--shadow)}
.track header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 6px 8px}
.track h3{font:800 20px/1.1 var(--f-display);color:var(--acc)}
.track header span{font-size:13px;color:var(--muted)}
.nodes{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:4px}
.nodes::before{content:"";position:absolute;left:29px;top:20px;bottom:20px;border-left:3px dotted var(--line)}
.node{position:relative;width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:10px;background:transparent;border:0;border-radius:14px;padding:6px 8px;text-align:left;cursor:pointer}
.node:hover{background:var(--surface-2)}
.node .g{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc);font:800 14px/1 var(--f-display);border:2.5px solid var(--acc);position:relative;z-index:1}
.node .nm{font-size:16px;line-height:1.25;min-width:0}
.node .stars{display:flex;gap:2px;margin-top:3px}
.node .tag{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.node.st-due .tag{color:var(--acc);font-weight:700}
.node.st-new .tag{color:var(--acc);font-weight:700}
.node.st-mastered .g{background:var(--star);border-color:var(--star);color:#3A2A00}
.node.st-locked{cursor:default}
.node.st-locked .g{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.node.st-locked .nm{color:var(--muted)}
.node.st-locked:hover{background:transparent}
.star{width:14px;height:14px;fill:var(--line)}
.star.on{fill:var(--star)}
.ico{width:22px;height:22px}

/* welcome / picker */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start;margin-bottom:28px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font:800 clamp(34px,6vw,52px)/1.05 var(--f-display);margin-bottom:12px}
.hero p{max-width:60ch;margin:0 0 10px}
.hero ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.hero li{margin-bottom:4px}
.form h2{font:800 24px/44px var(--f-display);margin-top:-8px}
.form label{display:block;font-weight:700;line-height:44px}
.form input[type=text]{width:100%;font:700 26px/1.2 var(--f-read);padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 18px;border:0;padding:0}
.swatches legend{font-weight:700;line-height:44px;padding:0}
.swatches label{line-height:1}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--cta);outline-offset:3px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kid{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;cursor:pointer;text-align:left}
.kid .ava{width:52px;height:52px;font-size:26px}
.kid b{font:800 24px/1.1 var(--f-display);min-width:0;overflow-wrap:anywhere}
.status{color:var(--muted);font-size:15px;margin:10px 0 0}

/* quiz */
.quiz{max-width:800px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qmeta{display:flex;flex-direction:column;min-width:0;flex:1}
.qtitle{font:800 20px/1.1 var(--f-display);color:var(--acc)}
.qround{font-size:13px;color:var(--muted)}
.pips{list-style:none;display:flex;gap:7px;margin:0;padding:0}
.pips li{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.pips li.now{border-color:var(--acc)}
.pips li.ok{background:var(--good);border-color:var(--good)}
.pips li.no{background:var(--oops);border-color:var(--oops)}
.prow{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:12px}
.prompt{font:700 clamp(24px,4.4vw,32px)/1.3 var(--f-read)}
.prompt.story{font-size:clamp(21px,3.6vw,26px);line-height:1.6;max-width:36ch}
.speak{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--acc);background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;cursor:pointer}
.speak .ico{width:26px;height:26px}
.visual{display:flex;justify-content:center;margin:6px 0 22px;min-width:0}
.visual > *{max-width:100%}
.vstack{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0;max-width:100%}
.eq{font:700 clamp(44px,9vw,64px)/1 var(--f-read);display:flex;gap:.28em;align-items:center;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums}
.eq .q,.box.q{display:inline-grid;place-items:center;min-width:1.25em;padding:0 .12em;border:3px dashed var(--acc);border-radius:12px;color:var(--acc)}
.frames{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,44px);border:3px solid var(--acc);border-radius:8px;overflow:hidden;background:var(--surface)}
.cell{height:44px;display:grid;place-items:center;font-size:28px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.cell:nth-child(5n){border-right:0}
.cell:nth-child(n+6){border-bottom:0}
@media (max-width:420px){.frame{grid-template-columns:repeat(5,38px)}.cell{height:38px;font-size:24px}}
.dots{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.grp{display:grid;grid-template-columns:repeat(5,22px);gap:7px}
.dot{display:block;width:22px;height:22px;border-radius:50%;position:relative}
.da{background:var(--math)}
.db{background:var(--read)}
.dot.x{opacity:.35}
.dot.x::before,.dot.x::after{content:"";position:absolute;left:-3px;right:-3px;top:9px;height:4px;border-radius:2px;background:var(--ink);transform:rotate(45deg)}
.dot.x::after{transform:rotate(-45deg)}
.cell .dot{width:24px;height:24px}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.box{min-width:68px;height:68px;padding:0 8px;display:grid;place-items:center;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);font:700 32px/1 var(--f-read);font-variant-numeric:tabular-nums}
.pic{font-size:clamp(84px,18vw,112px);line-height:1.1;text-align:center}
.pic-cap{text-align:center;font-size:18px;color:var(--muted);margin-top:-4px}
.bigword{font:700 clamp(46px,10vw,64px)/1.1 var(--f-read);text-align:center}
.sentence{display:flex;flex-direction:column;align-items:center;gap:12px}
.sentence p{font:700 clamp(26px,5vw,34px)/1.4 var(--f-read);margin:0;text-align:center;max-width:24ch}
.hear{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--acc);background:var(--acc-bg);color:var(--acc);border-radius:16px;padding:12px 18px;font:700 20px/1 var(--f-display);cursor:pointer}
.hear.small{font-size:15px;padding:8px 12px;border-radius:12px}
.hear .ico{width:24px;height:24px}
.clock{width:220px;height:220px;max-width:100%}
.cface{fill:var(--surface);stroke:var(--acc);stroke-width:6}
.tk{stroke:var(--line);stroke-width:1.5}
.tk.big{stroke:var(--ink);stroke-width:3}
.cn{font:700 20px var(--f-read);fill:var(--ink)}
.hh{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.mh{stroke:var(--read);stroke-width:5;stroke-linecap:round}
.hub{fill:var(--ink)}
.shape{width:220px;height:auto;max-width:100%}
.shape *{fill:var(--acc-bg);stroke:var(--acc);stroke-width:5;stroke-linejoin:round}
.b10{height:auto;max-width:100%}
.bt{fill:var(--math-bg);stroke:var(--math);stroke-width:1.6}
.bo{fill:var(--read-bg);stroke:var(--read);stroke-width:1.6}

.choices{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.choices.l-num,.choices.l-pic{grid-template-columns:repeat(4,minmax(0,1fr))}.choices.l-five{grid-template-columns:repeat(5,minmax(0,1fr))}}
.choices.l-three,.choices.l-five{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:640px){.choices.l-five{grid-template-columns:repeat(5,minmax(0,1fr))}}
.choices.l-wide{grid-template-columns:minmax(0,1fr)}
.choice{min-height:86px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:12px 10px;cursor:pointer;font:700 36px/1.1 var(--f-read);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums;transition:transform .08s ease}
.choice:hover{border-color:var(--acc)}
.choice:active{transform:translateY(3px)}
.l-word .choice{font-size:32px}
.l-wide .choice{font-size:24px;justify-content:flex-start;align-items:flex-start;text-align:left;padding:16px 18px;min-height:0}
.choice .emo{font-size:46px;line-height:1.1}
.choice small{font:400 15px/1.2 var(--f-read);color:var(--muted)}
.choice .sym{font-size:46px;line-height:1}
.choice.right{background:var(--good-bg);border-color:var(--good)}
.choice.wrong{background:var(--oops-bg);border-color:var(--oops);animation:shake .38s}
.choice.dim{opacity:.45}
.choices.locked .choice{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{min-height:64px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb .msg{font-size:20px;line-height:1.4;min-width:0;flex:1}
.fb .msg b.yay{font:800 24px/1 var(--f-display);color:var(--good)}
.fb .msg b.hmm{font:800 22px/1 var(--f-display);color:var(--oops)}

/* result + done */
.result{max-width:640px;margin:0 auto;text-align:center}
.result .page{text-align:left}
.bigstars{display:flex;gap:8px;justify-content:center;margin:4px 0 6px}
.bigstars .star{width:52px;height:52px}
.result h1{font:800 clamp(32px,6vw,44px)/44px var(--f-display);text-align:center}
.result p{font-size:19px;line-height:44px;margin:0}
.lvl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:44px}
.lvl .stars{display:inline-flex;gap:3px}
.lvl .star{width:20px;height:20px}
.result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.unlock{color:var(--acc);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* grown-ups */
.parents h1{font:800 34px/1.1 var(--f-display);margin-bottom:4px}
.parents .lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;border:1.5px solid var(--line)}
.tile .lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .val{font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.panel{background:var(--surface);border-radius:18px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font:800 20px/1.2 var(--f-display);margin-bottom:10px}
.panel h2.subj{color:var(--acc)}
.tbl{width:100%;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:620px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .stars{display:inline-flex;gap:2px}
.tbl .muted{color:var(--muted)}
.scores{display:inline-flex;gap:3px;align-items:flex-end;height:22px}
.scores i{width:7px;border-radius:2px;background:var(--acc)}
.scores i.low{background:var(--oops)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{background:var(--oops-bg);color:var(--ink);border-radius:8px;padding:1px 7px;font-size:13px}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.attn li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.attn b{color:var(--oops)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:15px}
.log li{display:grid;grid-template-columns:110px minmax(0,1fr) 60px 90px;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
@media (max-width:560px){.log li{grid-template-columns:minmax(0,1fr) auto}.log li .d,.log li .k{display:none}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow p{margin:0;min-width:0;flex:1}
.setrow small{display:block;color:var(--muted)}
.btn.danger{background:var(--oops);color:#fff}
.tip{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:15px}

.foot{margin-top:30px;color:var(--muted);font-size:13px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:10;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

  const next = R.scheduled || R.lv !== R.before ? `We'll practice this again ${whenText(R.days)}.` : 'Extra practice done. The next review stays the same.';
  return `<section class="result ${SUBJ[c.s].cls}">
    <div class="bigstars" aria-label="${R.score} out of ${R.total}">${Array.from({ length: R.total }, (_, i) => starSVG(i < R.score)).join('')}</div>
    <h1>${title}</h1>
    <div class="page" style="margin-top:18px">
      <p>${R.score} out of ${R.total} on ${c.title}.</p>
      <p>${line}</p>
      <p>${next}</p>
      ${R.unlocked ? `<p class="unlock">New topic opened: ${R.unlocked.title}!</p>` : ''}
    </div>
    <div class="row">${last ? '<button class="btn cta big" data-act="finish">All done</button>' : `<button class="btn cta big" data-act="next-round">Next round</button><button class="btn ghost" data-act="home">Stop for now</button>`}</div>
  </section>`;
}
function viewDone() {
  const L = cur(), today = dayStr(), n = streakOf(L, today);
  return `<section class="result s-math">
    <div class="bigstars">${starSVG(true)}${starSVG(true)}${starSVG(true)}</div>
    <h1>You finished today's practice!</h1>
    <div class="page" style="margin-top:18px">
      <p>${n > 1 ? `That's ${n} days in a row.` : 'Great start!'} You have ${L.stars || 0} stars.</p>
      <p>Come back tomorrow. Your notebook will know what to review.</p>
    </div>
    <div class="row"><button class="btn cta big" data-act="home">Back to my map</button></div>
  </section>`;
}
function viewParents(L) {
  const today = dayStr(), st = L.concepts || {}, started = CONCEPTS.filter(c => st[c.id]);
  const mastered = started.filter(c => st[c.id].lv >= 5).length;
  const weekRounds = (L.recent || []).filter(r => daysBetween(r.at.slice(0, 10), today) < 7).length;
  const tricky = started.filter(c => { const h = st[c.id].hist || []; return (h.length && h[h.length - 1] <= 2) || ((L.misses || {})[c.id] || []).length >= 3; });
  const perDay = (L.settings && L.settings.newPerDay) || 2;
  const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
  return `<section class="parents">
    <div class="qbar"><button class="btn ghost" data-act="home">Back</button></div>
    <h1>${esc(L.name)}'s progress</h1>
    <p class="lede">Each topic has a level from 0 to 5. A round of 5 questions with 4 or more right moves it up a level and pushes the next review further out (1, 3, 7, 14, then 30 days). 2 or fewer right drops it 2 levels and brings it back tomorrow. Questions she misses are asked again first next time.</p>
    <div class="tiles">
      <div class="tile"><div class="lbl">Day streak</div><div class="val">${streakOf(L, today)}</div></div>
      <div class="tile"><div class="lbl">Rounds, last 7 days</div><div class="val">${weekRounds}</div></div>
      <div class="tile"><div class="lbl">Topics started</div><div class="val">${started.length}<span style="font-size:16px;color:var(--muted)"> / ${CONCEPTS.length}</span></div></div>
      <div class="tile"><div class="lbl">Mastered</div><div class="val">${mastered}</div></div>
    </div>
    ${tricky.length ? `<div class="panel"><h2>Needs a little help</h2><ul class="attn">${tricky.map(c => `<li><b>${c.title}</b><span class="muted">${((L.misses || {})[c.id] || []).map(k => esc(keyName(c, k))).join(', ') || 'Low score last time'}</span></li>`).join('')}</ul></div>` : ''}
    ${SUBJECT_KEYS.map(s => `<div class="panel ${SUBJ[s].cls}"><h2 class="subj">${SUBJ[s].name}</h2><div class="tbl"><table>
      <thead><tr><th>Topic</th><th>Level</th><th>Next review</th><th>Recent rounds</th><th>Tricky items</th></tr></thead>
      <tbody>${bySubject(s).map(c => { const x = st[c.id], miss = ((L.misses || {})[c.id] || []);
        if (!x) return `<tr><td>${c.title}<div class="muted" style="font-size:13px">${c.about}</div></td><td class="muted" colspan="4">${isUnlocked(L, c) ? 'Not started yet' : 'Locked'}</td></tr>`;
        return `<tr><td>${c.title}<div class="muted" style="font-size:13px">${c.about}</div></td><td>${starsHTML(x.lv)}</td><td>${x.due <= today ? '<b>Today</b>' : whenText(daysBetween(today, x.due))}</td>
          <td><span class="scores" title="Scores out of 5">${(x.hist || []).map(v => `<i class="${v <= 2 ? 'low' : ''}" style="height:${4 + v * 3.6}px"></i>`).join('')}</span></td>
          <td>${miss.length ? `<div class="chips">${miss.map(k => `<span>${esc(keyName(c, k))}</span>`).join('')}</div>` : '<span class="muted">None</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>`).join('')}
    <div class="panel"><h2>Recent rounds</h2>${(L.recent || []).length ? `<ol class="log">${(L.recent || []).slice(-15).reverse().map(r => { const c = BY_ID[r.c]; return `<li><span class="d muted">${fmtDate(r.at)}</span><span>${c ? c.title : esc(r.c)}</span><span>${r.s}/${r.n}</span><span class="k muted">${KIND[r.k] || ''}</span></li>`; }).join('')}</ol>` : '<p class="muted">No rounds yet.</p>'}</div>
    <div class="panel"><h2>Settings</h2>
      <div class="setrow"><p>New topics per day<small>How many brand-new topics today's practice can add.</small></p>
        <div class="seg" role="group" aria-label="New topics per day">${[1, 2, 3].map(n => `<button data-act="set-new" data-n="${n}" aria-pressed="${n === perDay}">${n}</button>`).join('')}</div></div>
      <div class="setrow"><p>Learners<small>Add a brother or sister, or switch who is practicing.</small></p><button class="btn soft" data-act="switch">Switch or add</button></div>
      <div class="setrow"><p>Remove ${esc(L.name)}<small>Deletes all of ${esc(L.name)}'s progress. This can't be undone.</small></p>
        ${app.confirmDel ? `<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-act="del-yes">Yes, delete</button><button class="btn ghost" data-act="del-no">Keep</button></span>` : '<button class="btn ghost" data-act="del">Remove…</button>'}</div>
    </div>
    <p class="tip">To add new topics, change the pace, or get a summary of how ${esc(L.name)} is doing, ask Claude in the chat where this notebook was made. Claude can read this progress.</p>
  </section>`;
}

/* ---------------- flow ---------------- */
function selectLearner(id) { app.lid = id; prefs.set('lid', id); app.view = 'home'; app.confirmDel = false; render(); }
function startSession(plan) {
  if (!plan.length) return;
  app.session = { plan, pi: 0 }; startRound();
}
function startRound() {
  const s = app.session, item = s.plan[s.pi];
  s.round = { cid: item.cid, kind: item.kind, qs: buildRound(cur(), item.cid), qi: 0, res: [], missed: [], fixed: [], answered: false, token: Math.random() };
  app.view = 'quiz'; render(); askCurrent();
}
function askCurrent() { const r = app.session.round, q = r.qs[r.qi]; setTimeout(() => { if (app.view === 'quiz' && app.session.round === r) speech.say(q.say); }, 250); }
const PRAISE = ['Yes!', 'Great job!', 'You got it!', 'Nice work!', "That's right!", 'Super!'];
function answer(btn) {
  const r = app.session.round; if (r.answered) return;
  const q = r.qs[r.qi], v = btn.dataset.v, ok = v === q.answer, misses = (cur().misses || {})[r.cid] || [];
  r.answered = true; r.res.push(ok);
  if (ok && misses.includes(q.key)) r.fixed.push(q.key);
  if (!ok) r.missed.push(q.key);
  const box = $('#choices'); box.classList.add('locked');
  box.querySelectorAll('.choice').forEach(b => { b.disabled = true; if (b.dataset.v === q.answer) b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim'); });
  const pip = main.querySelectorAll('.pips li')[r.qi]; if (pip) pip.className = ok ? 'ok' : 'no';
  const fb = $('#fb'), lastQ = r.qi === r.qs.length - 1;
  if (ok) {
    const p = pick(PRAISE); chime(true); speech.say(p);
    fb.innerHTML = `<span class="msg"><b class="yay">${p}</b></span><button class="btn cta" data-act="next-q">${lastQ ? 'See my stars' : 'Next'}</button>`;
    const tok = r.token; setTimeout(() => { if (app.view === 'quiz' && app.session && app.session.round && app.session.round.token === tok && app.session.round.qi === r.qi) nextQ(); }, 1500);
  } else {
    chime(false); speech.say('Not quite. ' + q.explain);
    fb.innerHTML = `<span class="msg"><b class="hmm">Not quite.</b> ${q.explain}</span><button class="btn cta" data-act="next-q">${lastQ ? 'See my stars' : 'Next'}</button>`;
  }
}
function nextQ() {
  const r = app.session.round;
  if (!r.answered) return;
  r.qi++; r.answered = false; r.token = Math.random();
  if (r.qi < r.qs.length) { render(false); askCurrent(); } else finishRound();
}
function finishRound() {
  const r = app.session.round, L = clone(cur()), today = dayStr();
  const R = applyRound(L, r, today);
  store.save(L); app.result = R; app.view = 'result'; render();
  if (R.score >= R.total - 1) { chime('fanfare'); confetti(); }
  speech.say(R.score === R.total ? 'Perfect! You got all five!' : `You got ${R.score} out of ${R.total}.` + (R.lv > R.before ? ' Level up!' : ''));
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['var(--math)', 'var(--read)', 'var(--world)', 'var(--star)'];
  for (let i = 0; i < 36; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 4]; p.style.animationDelay = (Math.random() * .5) + 's'; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}

const actions = {
  'toggle-read': () => { speech.on = !speech.on; prefs.set('read', speech.on); if (!speech.on) speech.stop(); updateHeader(); },
  'switch': () => { app.view = 'pick'; render(); },
  'parents': () => { app.view = 'parents'; app.confirmDel = false; speech.stop(); render(); },
  'home': () => { app.view = 'home'; app.session = null; speech.stop(); render(); },
  'pick': t => selectLearner(t.dataset.id),
  'start-today': () => startSession(buildPlan(cur(), dayStr())),
  'start-extra': () => startSession(extraPlan(cur())),
  'practice': t => {
    const L = cur(), c = BY_ID[t.dataset.cid], today = dayStr();
    if (!isUnlocked(L, c)) { const list = bySubject(c.s), prev = list[list.indexOf(c) - 1]; toast(`Finish “${prev.title}” first to open this one.`); return; }
    const st = (L.concepts || {})[c.id];
    startSession([{ cid: c.id, kind: !st ? 'new' : st.due <= today ? (st.lv === 0 ? 'practice' : 'review') : 'extra' }]);
  },
  'answer': t => answer(t),
  'next-q': () => nextQ(),
  'speak-q': () => { const r = app.session.round; speech.say(r.qs[r.qi].say, true); },
  'hear': t => speech.say(t.dataset.say, true),
  'quit': () => { speech.stop(); app.session = null; app.view = 'home'; render(); },
  'next-round': () => { app.session.pi++; startRound(); },
  'finish': () => { app.session = null; app.view = 'done'; render(); speech.say("You finished today's practice! See you tomorrow."); },
  'set-new': t => { const L = clone(cur()); L.settings = Object.assign({}, L.settings, { newPerDay: +t.dataset.n }); store.save(L); render(false); },
  'del': () => { app.confirmDel = true; render(false); },
  'del-no': () => { app.confirmDel = false; render(false); },
  'del-yes': () => { const id = app.lid; app.lid = null; prefs.set('lid', null); app.confirmDel = false; store.remove(id); app.view = Object.keys(store.learners).length ? 'pick' : 'welcome'; render(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.getAttribute('aria-disabled') === 'true' && t.dataset.act !== 'practice') return;
  const fn = actions[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'new-learner') return;
  e.preventDefault();
  if (!store.ready) return;
  const name = $('#learner-name').value.trim().slice(0, 20);
  if (!name) { $('#learner-name').focus(); return; }
  const color = (e.target.querySelector('input[name=color]:checked') || {}).value || COLORS[0];
  const id = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const L = { id, name, color, created: new Date().toISOString(), concepts: {}, misses: {}, stars: 0, days: [], recent: [], today: { date: '', rounds: 0, fresh: 0 }, settings: { newPerDay: 2 } };
  store.save(L); selectLearner(id);
});

store.on(() => {
  if (!store.ready) return;
  const ids = Object.keys(store.learners);
  if (app.lid && !store.learners[app.lid]) app.lid = null;
  if (!app.lid) { const r = prefs.get('lid', null); if (r && store.learners[r]) app.lid = r; else if (ids.length === 1) app.lid = ids[0]; }
  const v = app.view;
  if (v === 'welcome') {
    if (ids.length) { app.view = app.lid ? 'home' : 'pick'; render(); }
    else { const b = $('#create-btn'); if (b) { b.disabled = false; b.textContent = 'Start my notebook'; } updateFoot(); }
  } else if (v === 'pick') {
    const list = main.querySelector('.kids'); if (list) { const tmp = document.createElement('div'); tmp.innerHTML = viewPick(); list.replaceWith(tmp.querySelector('.kids')); }
    const b = $('#create-btn'); if (b) { b.disabled = false; b.textContent = 'Start my notebook'; }
    updateHeader(); updateFoot();
  } else if (v === 'home' || v === 'parents') {
    if (!app.lid) { app.view = ids.length ? 'pick' : 'welcome'; render(); } else render(false);
  } else { updateHeader(); updateFoot(); }
});

window.__fgn = { CONCEPTS, buildPlan, applyRound, buildRound };
render(false);
store.init();
})();
</script>
