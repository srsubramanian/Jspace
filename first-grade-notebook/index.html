<title>First Grade Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@700;800&display=swap">
<style>
/* Layout: an empty canvas. One centered column (max 760px) that holds exactly one thing at a time:
   today's lesson title, then one question. Answer tiles are the only objects on the page. */
:root{
  --bg:#F5F7FB; --tile:#FFFFFF; --ink:#1D2433; --muted:#6A7488; --line:#DCE2EC;
  --accent:#3D63DD; --accent-soft:#E7EDFD; --accent-edge:#2C4BB0; --on-accent:#FFFFFF;
  --good:#1E9258; --good-soft:#E3F4EA; --oops:#C2453D; --oops-soft:#FAE8E6; --warm:#E07A2E;
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-read:"Andika","Comic Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --tile:#1B202B; --ink:#E8ECF4; --muted:#9AA4B8; --line:#2D3545;
    --accent:#8EA8FF; --accent-soft:#222C47; --accent-edge:#5470C9; --on-accent:#0D1220;
    --good:#4CCB8A; --good-soft:#173726; --oops:#FF8378; --oops-soft:#3D2124; --warm:#FFA25E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --tile:#1B202B; --ink:#E8ECF4; --muted:#9AA4B8; --line:#2D3545;
  --accent:#8EA8FF; --accent-soft:#222C47; --accent-edge:#5470C9; --on-accent:#0D1220;
  --good:#4CCB8A; --good-soft:#173726; --oops:#FF8378; --oops-soft:#3D2124; --warm:#FFA25E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 var(--f-read);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2{margin:0;text-wrap:balance}
.shell{min-height:100%;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;grid-template-rows:auto 1fr auto}
.bar{min-height:48px;display:flex;align-items:center;gap:14px}
.stage{display:flex;flex-direction:column;justify-content:center;padding-block:12px 28px;min-width:0}
.foot{display:flex;justify-content:center;min-height:40px;align-items:center}
.quiet{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 12px;cursor:pointer;opacity:.75}
.quiet:hover{opacity:1;text-decoration:underline}

/* buttons */
.go{align-self:center;border:0;border-radius:22px;background:var(--accent);color:var(--on-accent);font:800 30px/1 var(--f-display);padding:20px 54px;box-shadow:0 6px 0 var(--accent-edge);margin-bottom:6px;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-edge)}
.go.sm{font-size:22px;padding:14px 30px;border-radius:18px;box-shadow:0 5px 0 var(--accent-edge)}
.ghost{background:none;border:2px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer}
.close{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.close svg{width:18px;height:18px}
.track{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:5px;transition:width .35s ease}

/* start */
.start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.date{color:var(--muted);font-size:16px;letter-spacing:.04em;margin:0}
.cover{font-size:clamp(88px,22vw,128px);line-height:1.05}
.title{font:800 clamp(40px,8.5vw,64px)/1.05 var(--f-display);max-width:16ch;margin-bottom:14px}
.donemark{display:flex;align-items:center;gap:10px;color:var(--good);font:800 24px/1 var(--f-display)}
.donemark svg{width:30px;height:30px}
.ck{stroke:var(--bg)}
.note{color:var(--muted);max-width:40ch;margin:0}

/* a step */
.step{display:flex;flex-direction:column;gap:22px;min-width:0}
.prow{display:flex;align-items:flex-start;justify-content:center;gap:12px}
.prompt{font:700 clamp(26px,5vw,36px)/1.3 var(--f-read);text-align:center;min-width:0}
.prompt.long{font-size:clamp(22px,4vw,28px);line-height:1.55;text-align:left}
.text{font-size:clamp(20px,3.6vw,24px);line-height:1.55;text-align:center;margin:0;color:var(--ink)}
.replay{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;margin-top:2px}
.replay svg{width:24px;height:24px}
.shows{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.shows > *{max-width:100%}
.s-emoji{font-size:clamp(96px,24vw,140px);line-height:1.05;text-align:center}
.s-cap{color:var(--muted);text-align:center;margin-top:2px;font-size:18px}
.s-word{font:700 clamp(52px,12vw,84px)/1.1 var(--f-read);text-align:center;overflow-wrap:anywhere}
.s-sentence{display:flex;flex-direction:column;align-items:center;gap:12px}
.s-sentence p{font:700 clamp(28px,5.6vw,38px)/1.45 var(--f-read);margin:0;text-align:center;max-width:22ch}
.hear{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:18px;padding:16px 24px;font:800 22px/1 var(--f-display);cursor:pointer}
.hear.sm{font-size:15px;padding:8px 14px;border-radius:12px;font-family:var(--f-read);font-weight:700}
.hear svg{width:26px;height:26px}
.hear.sm svg{width:18px;height:18px}
.eq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.3em;font:700 clamp(46px,10vw,72px)/1 var(--f-read);font-variant-numeric:tabular-nums}
.qbox{display:inline-grid;place-items:center;min-width:1.2em;padding:.04em .12em;border:3px dashed var(--accent);border-radius:12px;color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.seq span{min-width:66px;height:66px;padding:0 10px;display:grid;place-items:center;border:2px solid var(--line);border-radius:14px;background:var(--tile);font:700 30px/1 var(--f-read);font-variant-numeric:tabular-nums}
.seq span.qbox{border:3px dashed var(--accent);background:var(--accent-soft)}
.frames{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,46px);border:3px solid var(--accent);border-radius:8px;overflow:hidden;background:var(--tile)}
.frame span{height:46px;display:grid;place-items:center;font-size:29px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.frame span:nth-child(5n){border-right:0}
.frame span:nth-child(n+6){border-bottom:0}
@media (max-width:420px){.frame{grid-template-columns:repeat(5,40px)}.frame span{height:40px;font-size:25px}}
.pairs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px}
.pair{display:flex;flex-direction:column;gap:4px;padding:5px;border:2.5px solid var(--accent);border-radius:16px;background:var(--tile)}
.pair span{width:46px;height:46px;display:grid;place-items:center;font-size:34px;line-height:1}
.pair.lone{border-color:var(--warm);border-style:dashed}
.pair .gap{border:2px dashed var(--line);border-radius:12px}
@media (max-width:420px){.pair span{width:38px;height:38px;font-size:28px}}
.dots{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.grp{display:grid;grid-template-columns:repeat(5,24px);gap:8px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--accent);position:relative}
.dot.b{background:var(--warm)}
.dot.x{opacity:.35}
.dot.x::before,.dot.x::after{content:"";position:absolute;left:-3px;right:-3px;top:10px;height:4px;border-radius:2px;background:var(--ink);transform:rotate(45deg)}
.dot.x::after{transform:rotate(-45deg)}
.clock{width:230px;height:230px}
.cface{fill:var(--tile);stroke:var(--accent);stroke-width:6}
.tk{stroke:var(--line);stroke-width:1.5}.tk.big{stroke:var(--ink);stroke-width:3}
.cn{font:700 20px var(--f-read);fill:var(--ink)}
.hh{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.mh{stroke:var(--warm);stroke-width:5;stroke-linecap:round}
.hub{fill:var(--ink)}
.shape{width:230px;height:auto}
.shape *{fill:var(--accent-soft);stroke:var(--accent);stroke-width:5;stroke-linejoin:round}
.b10{height:auto}
.bt{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.bo{fill:var(--oops-soft);stroke:var(--warm);stroke-width:1.6}

/* answers */
.choices{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media (min-width:640px){.choices{grid-template-columns:repeat(var(--cols-wide,var(--cols,2)),minmax(0,1fr))}}
.choice{min-height:92px;background:var(--tile);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 36px/1.15 var(--f-read);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:translateY(3px)}
.choices.word .choice{font-size:32px}
.choices.wide .choice{font-size:24px;align-items:flex-start;text-align:left;padding:16px 20px;min-height:0}
.choice .emo{font-size:50px;line-height:1.1}
.choice .lbl{font-size:17px;font-weight:400;color:var(--muted)}
.choice.right{background:var(--good-soft);border-color:var(--good)}
.choice.wrong{background:var(--oops-soft);border-color:var(--oops);animation:shake .38s}
.choice.dim{opacity:.4}
.choice[disabled]{cursor:default}
.choice.yes{border-color:var(--good);color:var(--good);font-family:var(--f-display);font-size:28px}
.choice.no{color:var(--muted);font-family:var(--f-display);font-size:28px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb .msg{flex:1;min-width:0;font-size:20px;line-height:1.45}
.fb .yay{font:800 26px/1 var(--f-display);color:var(--good)}
.fb .hmm{font:800 22px/1 var(--f-display);color:var(--oops)}
.next{align-self:center}

/* end */
.end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.end h1{font:800 clamp(44px,9vw,68px)/1.05 var(--f-display)}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:420px}
.stars svg{width:40px;height:40px;fill:var(--line)}
.stars svg.on{fill:#F2B100}
.end p{font-size:21px;margin:0}

/* grown-ups */
.gu h1{font:800 32px/1.1 var(--f-display);margin-bottom:6px}
.gu .lede{color:var(--muted);margin:0 0 22px;font-size:16px}
.gu section{margin-bottom:26px}
.gu h2{font:800 19px/1.2 var(--f-display);margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.kv div{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--tile)}
.kv b{display:block;font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kv span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line);font-size:16px}
.rows li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.rows .m{color:var(--muted);font-variant-numeric:tabular-nums}
.rows.tricky li{grid-template-columns:minmax(0,1fr) auto}
.empty-line{color:var(--muted);font-size:16px;margin:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow p{margin:0;flex:1;min-width:0;font-size:16px}
.setrow small{display:block;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--tile);padding:8px 16px;font-weight:700;cursor:pointer;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tip{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <div class="bar" id="bar"></div>
  <main class="stage" id="stage"><div class="start"><p class="note">Opening the notebook…</p></div></main>
  <div class="foot"><button class="quiet" id="grownups" data-act="grownups" hidden>Grown-ups</button></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/*
  First Grade Notebook — a one-lesson-at-a-time player. Lessons are written by Claude into this
  artifact's database; the page only plays them and records progress.

  lessons/<lessonId>   { title, date:"YYYY-MM-DD", cover?:emoji, subject?, items:[Item] }   (Claude writes)
  Item                 { id, kind:"choice"|"card"|"check", prompt, say?, text?, show?:Show|Show[],
                         choices?:[string | {text, emoji?, say?}], answer?:string, explain? }
  Show                 {type:"emoji",value,caption?} {type:"word",value} {type:"sentence",value} {type:"hear",value}
                       {type:"count",emoji,n} {type:"pairs",emoji,n} {type:"equation",value:"3 + 4 = ?"} {type:"sequence",values:[...,"?"]}
                       {type:"clock",h,m} {type:"shape",name} {type:"blocks",n} {type:"dots",a,b?|cross?}
  settings/main        { review: number of review questions after the lesson (default 3) }
  progress/<lessonId>  { title, runs, last, score, total, best, items:{ <itemId>:{b,due,r,w,last} } }  (page writes)
  stats/main           { days:[...], recent:[{at,l,r,n,done}] }                                     (page writes)

  Today's lesson = the lesson with the latest date that is not after today.
  Review = items from earlier lessons whose due date has come, oldest first.
  Spacing per item: a right first try moves it up a level (max 5) and schedules it 1, 3, 7, 14 or 30 days out;
  a miss drops it 2 levels and brings it back tomorrow.
*/
(() => {
'use strict';

const $ = (s, root = document) => root.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, kids) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, String(attrs[k])); if (kids) kids.forEach(c => e.appendChild(c)); return e; }
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Math.round(Number(v) || 0)));
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const dayStr = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); };
const prefs = {
  get(k, d) { try { const v = localStorage.getItem('fgn.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fgn.' + k, JSON.stringify(v)); } catch (e) {} }
};
const ICON = {
  speak: () => [svg('path', { d: 'M3.5 9.2v5.6h3.9l5 4V5.2l-5 4z', fill: 'currentColor' }), svg('path', { d: 'M15.6 8.6a4.8 4.8 0 0 1 0 6.8M18.2 6a8.5 8.5 0 0 1 0 12', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round' })],
  close: () => [svg('path', { d: 'M5 5l14 14M19 5L5 19', stroke: 'currentColor', 'stroke-width': 3, 'stroke-linecap': 'round' })],
  check: () => [svg('circle', { cx: 12, cy: 12, r: 11, fill: 'currentColor' }), svg('path', { class: 'ck', d: 'M6.5 12.5l3.6 3.4 7.4-7.6', fill: 'none', 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })],
  star: () => [svg('path', { d: 'M12 2.4l2.95 6.07 6.65.86-4.88 4.6 1.23 6.6L12 17.3l-5.95 3.23 1.23-6.6-4.88-4.6 6.65-.86z' })]
};
const iconEl = (name, cls) => { const e = svg('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, ICON[name]()); if (cls) e.setAttribute('class', cls); return e; };

/* ---------------- lesson data: normalize whatever is in the store ---------------- */
const SHOW_TYPES = new Set(['emoji', 'word', 'sentence', 'hear', 'count', 'pairs', 'equation', 'sequence', 'clock', 'shape', 'blocks', 'dots']);
const str = (v, max = 600) => typeof v === 'string' ? v.slice(0, max) : typeof v === 'number' ? String(v) : '';
function normItem(raw, i) {
  if (!raw || typeof raw !== 'object') return null;
  const it = { id: str(raw.id, 60) || 'i' + (i + 1), prompt: str(raw.prompt), say: str(raw.say), text: str(raw.text), explain: str(raw.explain), answer: str(raw.answer, 120) };
  const shows = Array.isArray(raw.show) ? raw.show : raw.show ? [raw.show] : [];
  it.show = shows.filter(s => s && typeof s === 'object' && SHOW_TYPES.has(s.type)).slice(0, 3);
  it.choices = (Array.isArray(raw.choices) ? raw.choices : []).slice(0, 6)
    .map(c => c && typeof c === 'object' ? { text: str(c.text, 120), emoji: str(c.emoji, 24), say: str(c.say, 160) } : { text: str(c, 120), emoji: '', say: '' })
    .filter(c => c.text);
  let kind = raw.kind === 'card' || raw.kind === 'check' ? raw.kind : it.choices.length >= 2 ? 'choice' : 'card';
  if (kind === 'choice' && it.choices.filter(c => c.text === it.answer).length !== 1) kind = 'card';
  it.kind = kind;
  return it.prompt || it.show.length || it.text ? it : null;
}
function normLesson(id, d) {
  if (!d || !Array.isArray(d.items)) return null;
  const items = d.items.map(normItem).filter(Boolean);
  if (!items.length) return null;
  const seen = new Set(); items.forEach((it, i) => { if (seen.has(it.id)) it.id += '_' + i; seen.add(it.id); });
  speech.learn(d.audio);
  return { id, title: str(d.title, 90) || 'Today', date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : '0000-00-00', cover: str(d.cover, 24), items };
}

/* ---------------- store ---------------- */
const S = { mode: 'connecting', db: null, lessons: [], progress: {}, stats: null, settings: {}, got: { lessons: false, progress: false }, ro: false, chain: Promise.resolve() };
async function connect() {
  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { S.mode = 'off'; changed(); return; }
  S.db = db; S.mode = 'db';
  const lost = () => { S.mode = 'off'; changed(); };
  try {
    db.collection('lessons').onSnapshot(snap => {
      S.lessons = snap.docs.filter(d => d.exists).map(d => normLesson(d.id, d.data())).filter(Boolean);
      S.got.lessons = true; changed();
    }, lost);
    db.collection('progress').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = clone(d.data()); });
      S.progress = m; S.got.progress = true; changed();
    }, () => {});
    db.doc('stats/main').onSnapshot(d => { S.stats = d.exists ? clone(d.data()) : null; }, () => {});
    db.doc('settings/main').onSnapshot(d => { S.settings = d.exists ? clone(d.data()) : {}; changed(); }, () => {});
  } catch (e) { lost(); }
}
function save(path, body) {
  if (S.mode !== 'db' || S.ro) return;
  const write = () => S.db.doc(path).set(body);
  const run = async () => {
    try { await write(); }
    catch (e) {
      const code = e && e.code;
      if (code === 'unavailable') { await sleep(600 + Math.random() * 900); try { await write(); return; } catch (e2) {} }
      if (code === 'invalid_argument') { S.ro = true; toast('This notebook is view-only for you, so answers are not being saved.'); return; }
      toast("Couldn't save just now. It will save with the next lesson.");
    }
  };
  S.chain = S.chain.then(run, run);

function viewGrownups() {
  const today = dayStr(), L = focusLesson(today), w = el('div', 'gu');
  const back = el('button', 'ghost', 'Back'); back.dataset.act = 'home'; bar.append(back);
  w.append(el('h1', null, 'Grown-ups'), el('p', 'lede', 'Plan each day\'s lesson with Claude. Claude can see everything on this page, so you can ask how she\'s doing or what to teach next.'));
  const lessons = S.lessons.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const due = dueReviews(today, L ? L.id : '', 999).length;
  const days = (S.stats && S.stats.days) || [];
  const kv = el('div', 'kv');
  [['Today', L ? L.title : 'No lesson'], ['Days practiced', days.length], ['Review due', due]].forEach(([k, v]) => { const d = el('div'); d.append(el('span', null, k), el('b', null, v)); kv.append(d); });
  const sec1 = el('section'); sec1.append(kv); w.append(sec1);

  const sec2 = el('section'); sec2.append(el('h2', null, 'Lessons'));
  if (!lessons.length) sec2.append(el('p', 'empty-line', 'No lessons yet.'));
  else {
    const ul = el('ul', 'rows');
    lessons.forEach(l => {
      const P = S.progress[l.id], li = el('li');
      const when = parseDay(l.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const res = l.date > today ? 'Coming up' : P && P.runs ? `${P.score}/${P.total}${P.runs > 1 ? ` · ${P.runs}×` : ''}` : 'Not done';
      li.append(el('span', 'm', when), el('span', null, l.title), el('span', 'm', res)); ul.append(li);
    });
    sec2.append(ul);
  }
  w.append(sec2);

  const tricky = [];
  for (const l of S.lessons) { const P = S.progress[l.id]; if (!P || !P.items) continue; for (const it of l.items) { const st = P.items[it.id]; if (st && st.w > 0 && (st.b || 0) <= 1) tricky.push({ l, it, st }); } }
  const sec3 = el('section'); sec3.append(el('h2', null, 'Still tricky'));
  if (!tricky.length) sec3.append(el('p', 'empty-line', 'Nothing yet. Missed questions show up here until she gets them right on later days.'));
  else {
    const ul = el('ul', 'rows tricky');
    tricky.sort((a, b) => b.st.w - a.st.w).slice(0, 12).forEach(({ l, it, st }) => {
      const sv = it.show[0], what = sv ? str(sv.value || sv.caption || (Array.isArray(sv.values) ? sv.values.join(', ') : ''), 60) : '';
      const li = el('li'); li.append(el('span', null, `${it.prompt || it.text}${what ? ` (${what})` : ''}${it.answer ? ' → ' + it.answer : ''}`), el('span', 'm', `${l.title} · missed ${st.w}×`)); ul.append(li);
    });
    sec3.append(ul);
  }
  w.append(sec3);

  const sec4 = el('section'); sec4.append(el('h2', null, 'Settings'));
  const r1 = el('div', 'setrow'), p1 = el('p', null, 'Review questions after the lesson'); p1.append(el('small', null, 'Questions from earlier lessons that are due to come back.'));
  const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Review questions');
  [0, 3, 5].forEach(n => { const b = el('button', null, n === 0 ? 'None' : n); b.dataset.act = 'set-review'; b.dataset.n = n; b.setAttribute('aria-pressed', String(reviewCount() === n)); seg.append(b); });
  r1.append(p1, seg);
  const r2 = el('div', 'setrow'), p2 = el('p', null, 'Read questions out loud'); p2.append(el('small', null, 'Lessons use the recorded voice. Anything without a recording uses this device\'s voice.'));
  const seg2 = el('div', 'seg'); [['On', true], ['Off', false]].forEach(([t, v]) => { const b = el('button', null, t); b.dataset.act = 'set-read'; b.dataset.v = v; b.setAttribute('aria-pressed', String(speech.on === v)); seg2.append(b); });
  r2.append(p2, seg2);
  if (speech.tts || speech.clips.size) sec4.append(r1, r2); else sec4.append(r1);
  w.append(sec4);
  stage.append(w);
}

/* ---------------- events ---------------- */
const actions = {
  start: () => startSession(),
  next: () => nextStep(),
  answer: t => answer(t),
  check: t => { const s = app.s; if (s.answered) return; s.answered = true; const ok = t.dataset.v === 'yes'; record(s.steps[s.i], ok); chime(ok); nextStep(); },
  replay: () => { const s = app.s, st = s.steps[s.i]; if (st.it) speech.say(st.it.say || st.it.prompt, true); },
  quit: () => { speech.stop(); if (app.s && Object.keys(app.s.first).length) persist(app.s, false); app.s = null; app.view = 'start'; render(); },
  home: () => { speech.stop(); app.s = null; app.view = 'start'; render(); },
  grownups: () => { app.view = 'grownups'; render(); },
  'set-review': t => { const n = Number(t.dataset.n); S.settings = Object.assign({}, S.settings, { review: n }); save('settings/main', S.settings); render(); },
  'set-read': t => { speech.on = t.dataset.v === 'true'; prefs.set('read', speech.on); if (!speech.on) speech.stop(); render(); },
};
document.addEventListener('click', e => {
  const t = e.target instanceof Element && e.target.closest('[data-act]');
  if (!t || !actions[t.dataset.act]) return;
  try { actions[t.dataset.act](t); } catch (err) { oops(err); }
});

window.__fgn = { normLesson, focusLesson, dueReviews, S };
render();
connect();
})();
</script>
